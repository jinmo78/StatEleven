<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}
body{background:radial-gradient(circle at 50% 42%,#065f46 0%,#022c22 55%,#020617 100%);position:relative;font-family:"Segoe UI",sans-serif}
.line{position:absolute;border:6px solid rgba(110,231,183,.22)}
.c{left:50%;top:50%;width:300px;height:300px;border-radius:50%;transform:translate(-50%,-50%)}
.h{left:0;right:0;top:50%;height:0;border-width:6px 0 0 0}
.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-53%);font-size:236px;font-weight:900;letter-spacing:-6px;color:#34d399;text-shadow:0 10px 30px rgba(0,0,0,.45)}
.tag{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);font-size:34px;font-weight:800;letter-spacing:10px;color:#d1fae5;opacity:.9}
</style></head><body>
<div class="line h"></div><div class="line c"></div>
<div class="num">11</div><div class="tag">STAT</div>
</body></html>
